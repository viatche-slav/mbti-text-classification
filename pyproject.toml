[project]
name = "mbti_text_classifier"
version = "0.1.0"
description = ""
authors = [
    {name = "Вячеслав Валиев",email = "valiev.va@phystech.edu"}
]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch (>=2.10.0,<3.0.0)",
    "pytorch-lightning (>=2.6.1,<3.0.0)",
    "transformers (>=5.0.0,<6.0.0)",
    "datasets (>=4.5.0,<5.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "mlflow (>=3.9.0,<4.0.0)",
    "dvc (>=3.66.1,<4.0.0)",
    "dvc-gdrive (>=3.0.1,<4.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "fire (>=0.7.1,<0.8.0)",
    "onnx (>=1.20.1,<2.0.0)",
    "onnxruntime (>=1.23.2,<2.0.0)",
    "pandas (>=2.0,<3.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "requests (>=2.32.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.1,<26.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)"
]
