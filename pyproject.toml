[tool.poetry]
name = "mbti-text-classifier"
version = "0.1.0"
description = "MBTI personality type classifier using text analysis"
authors = ["Viacheslav Valiev <valiev.va@phystech.edu>"]
readme = "README.md"
packages = [{include = "mbti_text_classifier"}]

[tool.poetry.dependencies]
python = "^3.10,<3.12"
torch = "^2.4.0"
pytorch-lightning = "^2.4.0"
transformers = "^4.44.0"
datasets = "^2.20.0"
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
mlflow = "^2.16.0"
dvc = "^3.55.0"
dvc-gdrive = "^3.0.0"
fire = "^0.6.0"
onnx = "^1.16.0"
onnxruntime = "^1.19.0"
pandas = "^2.2.0"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"
requests = "^2.32.0"
matplotlib = "^3.9.0"
fastapi = "^0.115.0"
uvicorn = "^0.31.0"
jinja2 = "^3.1.0"
tensorboard = "^2.17.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.0"
flake8 = "^7.1.0"
pre-commit = "^3.8.0"

[tool.poetry.scripts]
mbti-cli = "mbti_text_classifier.commands:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88
